name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # mesa-vulkan-drivers brings lavapipe, a software Vulkan, so the
        # renderer's drawing test runs for real instead of being skipped.
        # vulkan-validationlayers checks every Vulkan call those tests make;
        # LORE_REQUIRE_VALIDATION fails them if the layer did not load.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          echo "LORE_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"
          echo "LORE_REQUIRE_VALIDATION=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The `lore` command still builds with the editor left out.
      - run: cargo check -p lore --no-default-features --features cli

  # Gives lore.d.luau, the template and the example games to the Luau type
  # checker an editor uses, so the definitions are known to load there and the
  # scripts a new author reads first show no mistakes.
  types:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Type-check the scripts with luau-lsp
        shell: bash
        run: bash .github/scripts/check-types.sh

  # Draws the benchmark scene and fails if its frames have become much slower.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Install Linux build dependencies
        # lavapipe draws on the processor: these machines have no graphics card.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libvulkan1 mesa-vulkan-drivers
      - run: cargo build --release -p lore
      # Tests run debug builds, where this has always worked: a release
      # build once ended the game on any script mistake (#353).
      - name: A script mistake is shown, not fatal, in a release build
        run: |
          mkdir -p mistake
          echo 'game.onTik()' > mistake/main.luau
          ./target/release/lore check mistake > mistake.txt 2>&1 || true
          cat mistake.txt
          grep -q 'Did you mean game.onTick' mistake.txt
      # The budget is for a slow frame (99 of 100 are faster) on lavapipe on
      # this kind of machine, with room for a busy one; see docs/decisions.md.
      - name: Benchmark
        run: |
          set -o pipefail
          ./target/release/lore bench --budget-ms 450 --json bench.json | tee bench.txt
      - name: Show the numbers
        if: always()
        run: |
          {
            echo '```'
            cat bench.txt 2>/dev/null || echo 'The benchmark did not run.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore

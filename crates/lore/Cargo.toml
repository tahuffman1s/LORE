[package]
name = "lore"
description = "Free, open-source engine for first- and third-person 3D games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# There is no build without a window: the windowing, graphics, gamepad and
# sound libraries are always linked (#310). `lore check` and the tests still
# run on a machine with no display and no graphics card, because they never
# open a window; that is decided when the program runs, not when it is built.
default = ["cli", "editor"]
# Edit mode, `lore edit`: a game's level with a fly camera and a ground
# grid, in the same program. A build for players only can leave it out.
editor = ["lore-render/panels", "dep:egui", "dep:egui-winit"]
# The `lore` command (`lore new`, `lore run`, `lore package`). Off when
# the crate is used as a library, so a game written in Rust does not build a
# command-line parser or an archive writer.
cli = ["dep:clap", "dep:tar", "dep:flate2"]

[dependencies]
lore-input = { path = "../lore-input" }
lore-script = { path = "../lore-script" }
lore-pack = { path = "../lore-pack" }
lore-physics = { path = "../lore-physics" }
# The weapons players hold: firing, what a shot hits, rockets and grenades.
lore-weapons = { path = "../lore-weapons" }
# Reads a game's sound files, mixes them and plays them through the speakers.
lore-audio = { path = "../lore-audio" }
# The HUD and menus a game hands over each frame. No dependencies of its own.
lore-ui = { path = "../lore-ui" }
lore-render = { path = "../lore-render" }
# Reads a game's `level.glb`: the player collides with its shapes, and the
# pictures its materials use are decoded to be drawn.
lore-assets = { path = "../lore-assets" }
log = "0.4"
# Reads a game's `map.toml`. The same reader the bindings file uses.
toml = { version = "1.2", default-features = false, features = ["parse", "std"] }
# `lore package` writes the Linux `.tar.gz` itself, so packaging needs no
# `tar` program (Windows has none to rely on). No extended attributes: an
# archive should say nothing about the computer that made it.
tar = { version = "0.4", optional = true, default-features = false }
flate2 = { version = "1", optional = true }
winit = "0.30"
gilrs = "0.11"
clap = { version = "4.5", optional = true, default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
    # A packaged game's help is shown under the game's own name.
    "string",
] }
# The editor's panels. Without egui's own fonts (it is given the engine's),
# and without the clipboard and link opening, which nothing uses yet.
egui = { version = "0.36.2", default-features = false, optional = true }
egui-winit = { version = "0.36.2", default-features = false, optional = true }

[[bin]]
name = "lore"
required-features = ["cli"]

[lints]
workspace = true

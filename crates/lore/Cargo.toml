[package]
name = "lore"
description = "Free, open-source engine for first- and third-person 3D games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["window", "cli", "editor"]
# Opens a window, draws into it and reads keyboard, mouse and gamepads. A
# dedicated server builds without it and links no windowing, graphics or
# gamepad libraries.
window = [
    "dep:winit",
    "dep:gilrs",
    "dep:lore-render",
    "lore-audio/device",
    # The pictures a level's materials use are decoded only where they are drawn.
    "lore-assets/textures",
]
# Edit mode, `lore edit`: a game's level with a fly camera and a ground
# grid, in the same program. A build for players only can leave it out, and
# a dedicated server never has it.
editor = ["window", "lore-render/panels", "dep:egui", "dep:egui-winit"]
# The `lore` command (`lore new`, `lore run`, `lore package`). Off when
# the crate is used as a library, so a game written in Rust does not build a
# command-line parser or an archive writer.
cli = ["dep:clap", "dep:tar", "dep:flate2"]

[dependencies]
lore-input = { path = "../lore-input" }
lore-script = { path = "../lore-script" }
lore-net = { path = "../lore-net" }
lore-pack = { path = "../lore-pack" }
lore-physics = { path = "../lore-physics" }
# Reads a game's sound files and mixes them. Its `device` feature, which
# plays through the speakers and links a sound library, comes with `window`:
# a dedicated server has neither.
lore-audio = { path = "../lore-audio", default-features = false }
# The HUD and menus a game hands over each frame. No dependencies of its own.
lore-ui = { path = "../lore-ui" }
lore-render = { path = "../lore-render", optional = true }
# Reads a game's `level.glb`, for the server too: players collide with its
# shapes. Its `textures` feature, which decodes the pictures in it, is
# switched on by `window`, so a dedicated server links no image decoders.
lore-assets = { path = "../lore-assets", default-features = false }
log = "0.4"
# Reads a game's `map.toml`. The same reader the bindings file uses.
toml = { version = "1.2", default-features = false, features = ["parse", "std"] }
# Chooses which of a map's spawn points a player gets.
lore-mode = { path = "../lore-mode" }
# Ctrl-C and the operating system's "please end" requests, for a clean server stop.
ctrlc = { version = "3.4", features = ["termination"] }
# `lore package` writes the Linux `.tar.gz` itself, so packaging needs no
# `tar` program (Windows has none to rely on). No extended attributes: an
# archive should say nothing about the computer that made it.
tar = { version = "0.4", optional = true, default-features = false }
flate2 = { version = "1", optional = true }
winit = { version = "0.30", optional = true }
gilrs = { version = "0.11", optional = true }
clap = { version = "4.5", optional = true, default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
    # A packaged game's help is shown under the game's own name.
    "string",
] }
# The editor's panels. Without egui's own fonts (it is given the engine's),
# and without the clipboard and link opening, which nothing uses yet.
egui = { version = "0.36.2", default-features = false, optional = true }
egui-winit = { version = "0.36.2", default-features = false, optional = true }

[[bin]]
name = "lore"
required-features = ["window", "cli"]

[lints]
workspace = true

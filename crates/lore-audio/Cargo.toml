[package]
name = "lore-audio"
description = "Sound for LORE: positional mixing, footsteps and gunfire"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reads WAV files.
hound = "3.5"
# Reads Ogg Vorbis files. Pure Rust, MIT OR Apache-2.0.
lewton = "0.10"
log = "0.4"
# Plays through the computer's speakers. The mixer itself fills a plain
# buffer, so it is tested with no sound card.
cpal = "0.18"
# Hands commands to the sound thread without locking or asking for memory.
rtrb = "0.4"

[[example]]
name = "firefight"

[lints]
workspace = true

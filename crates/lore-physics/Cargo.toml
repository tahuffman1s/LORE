[package]
name = "lore-physics"
description = "Collision with a level and the character controller for LORE"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lore-assets = { path = "../lore-assets", default-features = false }
# Only the questions "what does this capsule hit" against the level's
# triangles. `enhanced-determinism` swaps the platform's math functions for
# software ones, so a move works out the same on every machine. The
# double-precision build: against a triangle hundreds of metres across, such
# as a level's ground, single precision is out by centimetres (#261).
parry3d = { package = "parry3d-f64", version = "0.31", default-features = false, features = ["required-features", "std", "alloc", "enhanced-determinism"] }

# Sine and cosine that give the same digits on every machine.
libm = "0.2"

[lints]
workspace = true

[package]
name = "lore-assets"
description = "Reads glTF levels and models into LORE engine data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Without `import`, so reading a file's buffers and images is ours to do: a
# level may only read files in or below its own folder.
gltf = { version = "1.4", default-features = false, features = [
    "utils",
    "names",
    "extras",
    "extensions",
    "KHR_texture_transform",
    "KHR_materials_emissive_strength",
    "KHR_lights_punctual",
] }
# Decodes the PNG and JPEG pictures a file uses.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Tangents for normal-mapped meshes that were exported without them.
bevy_mikktspace = "1.0"
# Files that carry their data inside themselves (`data:` addresses).
base64 = "0.22"
log = "0.4"

[lints]
workspace = true

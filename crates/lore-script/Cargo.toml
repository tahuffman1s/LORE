[package]
name = "lore-script"
description = "Luau scripting for LORE: runs a game's main.luau and the scripts it requires, reloads them on save and explains script errors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lore-input = { path = "../lore-input" }
# Where a HUD piece is pinned and its colour, for `game.hud`.
lore-ui = { path = "../lore-ui" }
# What a weapon is made of, for `game.weapon`, and the state of each one held.
lore-weapons = { path = "../lore-weapons" }
# What a kind of fluid is made of, for `game.fluid`.
lore-fluid = { path = "../lore-fluid" }
# Game shaders: reading their values and what they are for, for `game.shaders`.
lore-shader = { path = "../lore-shader" }
libm = "0.2"
log = "0.4"
mlua = { version = "0.12", features = ["luau"] }

[lints]
workspace = true

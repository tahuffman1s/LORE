[package]
name = "lore-script"
description = "Luau scripting for LORE: runs a game's main.luau and the scripts it requires, reloads them on save and explains script errors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lore-input = { path = "../lore-input" }
lore-mode = { path = "../lore-mode" }
log = "0.4"
mlua = { version = "0.12", features = ["luau"] }

[lints]
workspace = true
